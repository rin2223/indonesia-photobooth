<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indonesia Photobooth 2026</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f8f2eb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.screen{
display:none;
width:100%;
padding:30px;
text-align:center;
}

.active{
display:block;
}

.welcome-box{
max-width:700px;
margin:auto;
}

.welcome-box h1{
font-size:42px;
margin-bottom:20px;
}

.welcome-box h2{
margin-bottom:10px;
}

.welcome-box p{
margin:20px 0;
font-size:18px;
}

button{
padding:14px 28px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

#startBtn{
background:#b30000;
color:white;
}

.template-container{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:40px;
}

.template-card{
width:280px;
padding:15px;
border:2px solid #ddd;
border-radius:15px;
cursor:pointer;
background:white;
}

.template-card img{
width:100%;
border-radius:10px;
}

.template-card:hover{
border-color:#b30000;
}

</style>
</head>

<body>

<!-- WELCOME -->
<section id="welcome" class="screen active">

<div class="welcome-box">

<h1>مرحبًا بكم في معرض إندونيسيا</h1>

<h2>المقام في</h2>

<h2>كلية عائشة بنت أبي بكر</h2>

<p>
التقطوا أجمل لحظاتكم واحتفظوا بها ذكرى مميزة
</p>

<button id="startBtn">ابدأ التصوير</button>

</div>

</section>

<!-- TEMPLATE -->
<section id="template" class="screen">

<h1>Choose Your Template</h1>

<div class="template-container">

<div class="template-card" onclick="openCamera(3)">
<img src="assets/frame-3.png">
<h3>3 Photos</h3>
</div>

<div class="template-card" onclick="openCamera(4)">
<img src="assets/frame-4.png">
<h3>4 Photos</h3>
</div>

</div>

</section>

<!-- CAMERA -->
<section id="camera" class="screen">

<h1 id="countdown" style="font-size:60px;color:#b30000;"></h1>
<div id="flash" style="position:fixed;top:0;left:0;width:100%;height:100%;background:white;opacity:0;pointer-events:none;"></div>

<h1>Kamera Photobooth</h1>

<select id="timer">
  <option value="3">3 Detik</option>
  <option value="5">5 Detik</option>
  <option value="10">10 Detik</option>
</select>

<br><br>

<video id="video" autoplay playsinline
style="width:90%;max-width:400px;border-radius:15px;"></video>

<br><br>

<button onclick="takePhoto()">📸 Capture</button>

<canvas id="canvas" style="display:none;"></canvas>

<img id="preview" style="width:90%;max-width:400px;margin-top:20px;border-radius:15px;display:none;">

<br><br>

<a id="download" style="display:none;" download="photo.png">
<button>⬇️ Download</button>
</a>

<canvas id="stripCanvas"></canvas>
<img id="preview">
<a id="download" download="photo.png"></a>
  
</section>

<script>

const startBtn=document.getElementById("startBtn");

startBtn.onclick=()=>{

document.getElementById("welcome").classList.remove("active");
document.getElementById("template").classList.add("active");

};
function takePhoto(){

let timer = document.getElementById("timer").value;

let count = 3;
let countdownEl = document.getElementById("countdown");

function startCountdown(){

countdownEl.innerText = count;

let interval = setInterval(()=>{

count--;

if(count > 0){
countdownEl.innerText = count;
}else{
clearInterval(interval);
countdownEl.innerText = "";

flashScreen();
capturePhoto();
}

}, 1000);

}

function flashScreen(){

let flash = document.getElementById("flash");
flash.style.opacity = "1";

setTimeout(()=>{
flash.style.opacity = "0";
}, 200);

}

function capturePhoto(){

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");
let preview = document.getElementById("preview");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

canvas.getContext("2d").drawImage(video,0,0);

let data = canvas.toDataURL("image/png");

window.photosTaken.push(data);

preview.src = data;
preview.style.display = "block";

if(window.photosTaken.length < window.totalPhotos){
setTimeout(takePhoto, 800);
}else{
makeStrip();
alert("Semua foto selesai 📸");
}

}

startCountdown();

}

function openCamera(totalPhotos){

window.totalPhotos = totalPhotos;
window.photosTaken = [];

document.getElementById("template").classList.remove("active");
document.getElementById("camera").classList.add("active");

navigator.mediaDevices.getUserMedia({
video:{ facingMode:"user" }
})
.then(stream=>{
document.getElementById("video").srcObject = stream;
});

}

function makeStrip(){

let canvas = document.getElementById("stripCanvas");
let ctx = canvas.getContext("2d");

let w = 300;
let h = 400;

// 1. tentukan frame dari template
let frame = new Image();

if(window.totalPhotos == 3){
frame.src = "assets/frame-3.png";
}else{
frame.src = "assets/frame-4.png";
}

frame.onload = ()=>{

// 2. gambar frame dulu (background template kamu)
ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);

// 3. gambar foto di atas frame
let header = 100;
let loaded = 0;

window.photosTaken.forEach((imgSrc,i)=>{

let img = new Image();
img.src = imgSrc;

img.onload = ()=>{

ctx.drawImage(img, 0, header + (i*h), w, h);

loaded++;

if(loaded === window.photosTaken.length){

let final = canvas.toDataURL("image/png");

document.getElementById("preview").src = final;
document.getElementById("preview").style.display = "block";

document.getElementById("download").href = final;
document.getElementById("download").style.display = "block";

alert("Selesai pakai template 📸");

}

};

});

};

}
</script>

</body>
</html>
