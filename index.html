<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indonesia Photobooth 2026</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f8f2eb;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.screen{
display:none;
width:100%;
padding:30px;
text-align:center;
}

.active{
display:block;
}

.welcome-box{
max-width:700px;
margin:auto;
}

.welcome-box h1{
font-size:42px;
margin-bottom:20px;
}

.welcome-box h2{
margin-bottom:10px;
}

.welcome-box p{
margin:20px 0;
font-size:18px;
}

button{
padding:14px 28px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

#startBtn{
background:#b30000;
color:white;
}

.template-container{
display:flex;
gap:20px;
justify-content:center;
flex-wrap:wrap;
margin-top:40px;
}

.template-card{
width:280px;
padding:15px;
border:2px solid #ddd;
border-radius:15px;
cursor:pointer;
background:white;
}

.template-card img{
width:100%;
border-radius:10px;
}

.template-card:hover{
border-color:#b30000;
}
</style>
</head>
<body>

<!-- WELCOME -->

<section id="welcome" class="screen active">

<div class="welcome-box">

<h1>مرحبًا بكم في معرض إندونيسيا</h1>

<h2>المقام في</h2>

<h2>كلية عائشة بنت أبي بكر</h2>

<p>
التقطوا أجمل لحظاتكم واحتفظوا بها ذكرى مميزة
</p>

<button id="startBtn">
ابدأ التصوير
</button>

</div>

</section>

<!-- TEMPLATE -->

<section id="template" class="screen">

<h1>Choose Your Template</h1>

<div class="template-container">

<div class="template-card" onclick="openCamera(3)">
<img src="assets/frame-3.png">
<h3>3 Photos</h3>
</div>

<div class="template-card" onclick="openCamera(4)">
<img src="assets/frame-4.png">
<h3>4 Photos</h3>
</div>

</div>

</section>
<script>

const startBtn=document.getElementById("startBtn");

startBtn.onclick=()=>{

document.getElementById("welcome")
.classList.remove("active");

document.getElementById("template")
.classList.add("active");

};
function openCamera(totalPhotos){

  function openCamera(totalPhotos){

  document.getElementById("template")
    .classList.remove("active");

  document.getElementById("camera")
    .classList.add("active");

  navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:"user"
    }
  })
  .then(stream=>{
    document.getElementById("video").srcObject = stream;
  });

  }

}
</section>

<!-- CAMERA -->

<section id="camera" class="screen">

<h1>Kamera Photobooth</h1>

<p>Pilih timer:</p>

<select>
  <option>3 Detik</option>
  <option>5 Detik</option>
  <option>10 Detik</option>
</select>

<br><br>

<video id="video"
autoplay
playsinline
style="width:90%;max-width:400px;border-radius:15px;">
</video>

</section>

<script>
}

</body>
</html>
