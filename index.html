<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Photobooth Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(#b30000,#ff4d4d);
text-align:center;
color:white;
}

h1{
margin-top:10px;
font-size:35px;
}

video{
width:90%;
max-width:400px;
border-radius:20px;
border:5px solid white;
}

button{
padding:12px 20px;
font-size:18px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
}

#strip{
display:none;
}

canvas{
margin-top:20px;
max-width:90%;
border:5px solid white;
}
</style>
</head>

<body>

<h1>إندونيسيا</h1>
<h3>معرض الثقافة الإندونيسية</h3>

<video id="video" autoplay></video>

<br>

<button onclick="start()">📸 Mulai 3 Foto</button>
<button onclick="download()">⬇ Download</button>

<canvas id="canvas"></canvas>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream;
});

let photos=[];

function wait(ms){
return new Promise(r=>setTimeout(r,ms));
}

async function start(){

photos=[];

for(let i=0;i<3;i++){
await wait(1500);

let c=document.createElement("canvas");
c.width=300;
c.height=200;
let cctx=c.getContext("2d");

cctx.drawImage(video,0,0,300,200);
photos.push(c);
}

makeStrip();
}

function makeStrip(){

canvas.width=300;
canvas.height=650;

ctx.fillStyle="white";
ctx.fillRect(0,0,300,650);

ctx.fillStyle="red";
ctx.fillRect(0,0,300,60);

ctx.fillStyle="white";
ctx.font="16px Arial";
ctx.fillText("Indonesia Photobooth",70,35);

let y=80;

for(let p of photos){
ctx.drawImage(p,0,y,300,180);
y+=200;
}

ctx.fillStyle="red";
ctx.fillRect(0,590,300,60);

ctx.fillStyle="white";
ctx.fillText("معرض الثقافة الإندونيسية",30,625);
}

function download(){
let link=document.createElement("a");
link.download="photobooth.png";
link.href=canvas.toDataURL();
link.click();
}
</script>

</body>
</html>
