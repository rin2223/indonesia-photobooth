<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photobooth 2026</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f0ea;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.screen{display:none; text-align:center; width:100%;}
.active{display:block;}

button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-size:16px;
background:#b30000;
color:white;
}

.template-card{
display:inline-block;
margin:10px;
padding:10px;
border:2px solid #ddd;
border-radius:12px;
cursor:pointer;
}

video{
width:300px;
border-radius:12px;
margin-top:10px;
}

#countdown{
font-size:60px;
color:#b30000;
}

#flash{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:white;
opacity:0;
pointer-events:none;
}
</style>
</head>

<body>

<!-- WELCOME -->
<section id="welcome" class="screen active">
<h1>Photobooth Indonesia</h1>
<p>Click start</p>
<button onclick="goTemplate()">Start</button>
</section>

<!-- TEMPLATE -->
<section id="template" class="screen">
<h2>Select Frame</h2>

<div class="template-card" onclick="openCamera(3)">
<img src="assets/frame-3.png" width="200"><br>
3 Photos
</div>

<div class="template-card" onclick="openCamera(4)">
<img src="assets/frame-4.png" width="200"><br>
4 Photos
</div>
</section>

<!-- CAMERA -->
<section id="camera" class="screen">

<h1 id="countdown"></h1>
<div id="flash"></div>

<select id="timer">
<option value="3">3 sec</option>
<option value="5">5 sec</option>
<option value="10">10 sec</option>
</select>

<br><br>

<video id="video" autoplay playsinline></video>

<br><br>

<button onclick="takePhoto()">Capture</button>

<canvas id="canvas" style="display:none;"></canvas>

<br><br>

<img id="preview" style="max-width:300px;display:none;">

<br><br>

<a id="download" download="photobooth.png" style="display:none;">
<button>Download</button>
</a>

<canvas id="strip" style="display:none;"></canvas>

<img id="result" style="max-width:300px;display:none;">

<div id="qrcode"></div>
</section>

<script>

let stream;

function goTemplate(){
document.getElementById("welcome").classList.remove("active");
document.getElementById("template").classList.add("active");
}

function openCamera(total){
window.totalPhotos = total;
window.photosTaken = [];
window.selectedFrame = total;

document.getElementById("template").classList.remove("active");
document.getElementById("camera").classList.add("active");

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(s=>{
stream = s;
document.getElementById("video").srcObject = stream;
});
}

function takePhoto(){

let delay = parseInt(document.getElementById("timer").value);
let count = delay;

let countdown = document.getElementById("countdown");

let interval = setInterval(()=>{

count--;
countdown.innerText = count;

if(count <= 0){
clearInterval(interval);
countdown.innerText = "";
flash();
capture();
}
},1000);

function flash(){
let f = document.getElementById("flash");
f.style.opacity = 1;
setTimeout(()=>f.style.opacity=0,150);
}

function capture(){

let video = document.getElementById("video");
let canvas = document.getElementById("canvas");

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

let ctx = canvas.getContext("2d");
ctx.drawImage(video,0,0);

let data = canvas.toDataURL("image/png");

window.photosTaken.push(data);

if(window.photosTaken.length < window.totalPhotos){
setTimeout(takePhoto,800);
}else{
makeStrip();
}
}
}

function makeStrip(){

let c = document.getElementById("strip");
let ctx = c.getContext("2d");

let frame = new Image();

let positions = (window.selectedFrame == 3)
? [
{x:30,y:160,w:340,h:240},
{x:30,y:430,w:340,h:240},
{x:30,y:700,w:340,h:240}
]
: [
{x:60,y:250,w:520,h:400},
{x:620,y:250,w:520,h:400},
{x:60,y:690,w:520,h:400},
{x:620,y:690,w:520,h:400}
];

frame.onload = async () => {

c.width = frame.naturalWidth;
c.height = frame.naturalHeight;

ctx.clearRect(0,0,c.width,c.height);

// 1. gambar foto dulu
for(let i=0;i<window.photosTaken.length;i++){
let img = new Image();
img.src = window.photosTaken[i];

await new Promise(res=>{
img.onload = () => {
if(positions[i]){
ctx.drawImage(img,
positions[i].x,
positions[i].y,
positions[i].w,
positions[i].h);
}
res();
};
});
}

// 2. overlay frame DI ATAS foto
ctx.drawImage(frame,0,0,c.width,c.height);

let final = c.toDataURL("image/png");

// tampilkan hasil
let result = document.getElementById("result");
result.src = final;
result.style.display = "block";

// download link
let dl = document.getElementById("download");
dl.href = final;
dl.style.display = "inline-block";

generateQR(final);

alert("Selesai 🎉");
};

frame.src = window.selectedFrame == 3
? "assets/frame-3.png"
: "assets/frame-4.png";
}

</script>

</body>
</html>
