<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Photobooth Indonesia</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
text-align:center;
color:white;
background:linear-gradient(135deg,#b30000,#ff4d4d,#ffcc00);
overflow-x:hidden;
}

h1{
margin-top:10px;
animation:pop 1s infinite alternate;
}

@keyframes pop{
from{transform:scale(1);}
to{transform:scale(1.1);}
}

video{
width:90%;
max-width:400px;
border-radius:20px;
border:5px solid white;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

button{
padding:12px 18px;
font-size:16px;
margin:10px;
border:none;
border-radius:10px;
cursor:pointer;
background:white;
color:black;
font-weight:bold;
}

canvas{
margin-top:10px;
width:90%;
max-width:320px;
border:5px solid white;
background:white;
}

#flash{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
opacity:0;
pointer-events:none;
}
</style>
</head>

<body>

<div id="flash"></div>

<h1>إندونيسيا 🇮🇩</h1>
<h3>معرض الثقافة الإندونيسية</h3>

<video id="video" autoplay></video>

<br>

<button onclick="start()">📸 Mulai 3 Foto</button>
<button onclick="download()">⬇ Download</button>

<canvas id="canvas"></canvas>

<audio id="shutter">
<source src="https://www.soundjay.com/camera/sounds/camera-shutter-click-01.mp3">
</audio>

<script>
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const flash=document.getElementById("flash");
const shutter=document.getElementById("shutter");

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
video.srcObject=stream;
});

let shots=[];

function wait(ms){
return new Promise(r=>setTimeout(r,ms));
}

function doFlash(){
flash.style.opacity=1;
setTimeout(()=>flash.style.opacity=0,200);
}

async function start(){

shots=[];

for(let i=0;i<3;i++){

await wait(1500);

// countdown kecil efek
document.body.style.filter="brightness(1.5)";
setTimeout(()=>document.body.style.filter="none",200);

// flash kamera
doFlash();

// sound
shutter.currentTime=0;
shutter.play();

// capture
let c=document.createElement("canvas");
c.width=300;
c.height=200;
let cctx=c.getContext("2d");
cctx.drawImage(video,0,0,300,200);

shots.push(c);
}

makeStrip();
}

function makeStrip(){

canvas.width=300;
canvas.height=650;

// background rame
let grad=ctx.createLinearGradient(0,0,300,650);
grad.addColorStop(0,"red");
grad.addColorStop(0.5,"white");
grad.addColorStop(1,"red");

ctx.fillStyle=grad;
ctx.fillRect(0,0,300,650);

// header
ctx.fillStyle="rgba(0,0,0,0.3)";
ctx.fillRect(0,0,300,70);

ctx.fillStyle="white";
ctx.font="14px Arial";
ctx.fillText("إندونيسيا - معرض الثقافة الإندونيسية",10,40);

let y=90;

for(let img of shots){
ctx.drawImage(img,10,y,280,170);
y+=190;
}

// footer
ctx.fillStyle="rgba(0,0,0,0.3)";
ctx.fillRect(0,580,300,70);

ctx.fillStyle="white";
ctx.fillText("Photobooth Event Indonesia 🇮🇩",40,620);
}

function download(){
let link=document.createElement("a");
link.download="photobooth.png";
link.href=canvas.toDataURL("image/png");
link.click();
}
</script>

</body>
</html>
